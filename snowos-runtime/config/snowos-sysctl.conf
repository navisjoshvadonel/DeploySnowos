# SnowOS sysctl configuration
# ─────────────────────────────────────────────────────────────────────────────
# This file documents the sysctl parameters that SysctlTuner applies at
# runtime. It is provided as a reference and can also be loaded via:
#
#   sysctl -p /etc/snowos/snowos-sysctl.conf
#
# to manually apply the BALANCED profile at boot time.
#
# For the full profile set (performance / balanced / intelligent), use
# the SnowOS SysctlTuner at runtime — it selects the appropriate values
# based on detected system load.
# ─────────────────────────────────────────────────────────────────────────────

# ── PROFILE: BALANCED (safe defaults applied at boot) ───────────────────────

# Memory management
# Low swappiness keeps hot data in RAM; still allows swapping under pressure.
vm.swappiness = 10

# Defer writing dirty pages to disk slightly to batch I/O writes.
vm.dirty_ratio = 20
vm.dirty_background_ratio = 10

# Don't aggressively reclaim VFS caches — speeds up repeated file access.
vm.vfs_cache_pressure = 100

# ── CPU Scheduler ────────────────────────────────────────────────────────────
# Preemption granularity: how long a task runs before the scheduler may
# preempt it. 1 ms is a solid desktop balance between throughput and latency.
kernel.sched_min_granularity_ns = 1000000

# Wakeup granularity: how long a newly woken task must run before it can
# preempt a running task. Reduces thrashing from frequent wake-ups.
kernel.sched_wakeup_granularity_ns = 750000

# Migration cost: artificial penalty to moving tasks between CPUs to avoid
# cache-cold migrations. 3 ms suits quad-core+ systems.
kernel.sched_migration_cost_ns = 3000000

# ── Network buffers ──────────────────────────────────────────────────────────
# Moderate buffer sizes for the SnowControl web interface and Nyx API server.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 1000

# ─────────────────────────────────────────────────────────────────────────────
# PROFILE: PERFORMANCE
# Applied automatically by SysctlTuner when CPU usage > 85%.
# Key changes from balanced:
#   vm.swappiness                   = 5
#   vm.dirty_ratio                  = 15
#   vm.dirty_background_ratio       = 5
#   vm.vfs_cache_pressure           = 50
#   kernel.sched_min_granularity_ns = 500000
#   kernel.sched_wakeup_granularity_ns = 250000
#   kernel.sched_migration_cost_ns  = 5000000
#   net.core.rmem_max               = 134217728
#   net.core.wmem_max               = 134217728
#   net.core.netdev_max_backlog     = 5000
#   CPU governor                    = performance
#   I/O scheduler                   = deadline

# ─────────────────────────────────────────────────────────────────────────────
# PROFILE: INTELLIGENT (power-saver / background AI learning)
# Applied automatically by SysctlTuner when CPU usage < 20%.
# Key changes from balanced:
#   vm.swappiness                   = 60
#   vm.dirty_ratio                  = 40
#   vm.dirty_background_ratio       = 20
#   vm.vfs_cache_pressure           = 200
#   kernel.sched_min_granularity_ns = 3000000
#   kernel.sched_wakeup_granularity_ns = 2000000
#   kernel.sched_migration_cost_ns  = 2000000
#   CPU governor                    = powersave
#   I/O scheduler                   = bfq
