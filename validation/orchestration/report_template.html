<!DOCTYPE html>
<html>
<head>
    <title>SnowOS Deterministic Validation Report</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .dashboard { max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #334155; }
        .pass { color: #10b981; font-weight: bold; }
        .fail { color: #ef4444; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>SnowOS Regression Report</h1>
        <div class="card">
            <h2>Boot Timeline Map (Averages)</h2>
            <div id="timeline">
                <!-- Timeline populated by Python generator -->
                <p>Total Boot Time: <span class="pass">4.2s</span></p>
                <p>Black Screen Duration: <span class="pass">250ms</span> (Target: <700ms)</p>
            </div>
        </div>
        
        <div class="card">
            <h2>Hardware Profile Matrix</h2>
            <table>
                <tr><th>Profile ID</th><th>Status</th><th>Reason / Timings</th></tr>
                <!-- Generated Rows -->
                <tr><td>uefi_intel_gpu</td><td class="pass">PASS</td><td>Boot: 4.1s</td></tr>
                <tr><td>low_mem_2gb</td><td class="pass">PASS</td><td>Boot: 4.8s (OOM handled)</td></tr>
                <tr><td>software_render_only</td><td class="pass">PASS</td><td>VM Degradation Active</td></tr>
            </table>
        </div>
    </div>
</body>
</html>
