---
# Calamares Bootloader Configuration for SnowOS Aurora
# Hardened dual UEFI & BIOS bootloader deployment pipeline

efiBootLoader: "GRUB"
kernel: "/boot/vmlinuz"
img: "/boot/initrd.img"

# Core utilities
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Bootloader identifier registered in UEFI firmware NVRAM
bootloaderId: "SnowOS"

# Epilogue execution: updates GRUB entries with SnowOS Aurora identity
installEpilogue: "update-grub"
